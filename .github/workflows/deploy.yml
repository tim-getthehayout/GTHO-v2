name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - name: Disposable unit RLS and integrity SQL tests
        run: |
          npm install --prefix "$RUNNER_TEMP/unit-sql" --no-package-lock --no-audit --no-fund @electric-sql/pglite@0.5.15
          PGLITE_MODULE="$RUNNER_TEMP/unit-sql/node_modules/@electric-sql/pglite/dist/index.js" node tests/sql/run-unit-references.mjs
          PGLITE_MODULE="$RUNNER_TEMP/unit-sql/node_modules/@electric-sql/pglite/dist/index.js" node tests/sql/run-historical-feed-basis.mjs
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GTHO_ASSISTANT: ${{ vars.VITE_GTHO_ASSISTANT }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # deploy-pages lists this run's artifacts by API ~0.3 s after the upload
      # finalizes; sometimes the list is not caught up yet and it fails with
      # 'No artifacts named "github-pages" were found' (runs 45032178574,
      # 45044088293, 45048777574, 45228377048). Retry once after a short wait
      # instead of needing a manual re-run of the whole build.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait for the Pages artifact before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
